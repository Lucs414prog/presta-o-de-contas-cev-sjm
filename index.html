<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prestação de contas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f7f6;--surface:#fff;--ink:#16302b;--muted:#5b6f6a;--line:#d8e1de;--receita:#2f7d5b;--despesa:#c4553b;--r:6px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Source Sans 3",system-ui,sans-serif}
h1,h2{font-family:"Source Serif 4",Georgia,serif;line-height:1.2;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:32px 20px 56px}
header{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:end;margin-bottom:24px}
.org{margin:0 0 4px;color:var(--muted)}
h1{font-size:clamp(1.8rem,4vw,2.6rem)}
.periodo label{display:block;font-size:.875rem;color:var(--muted);margin-bottom:4px}
select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);min-width:220px}
:focus-visible{outline:3px solid #7fb8a3;outline-offset:2px}
.aviso{padding:12px 16px;border-radius:var(--r);margin-bottom:20px;border:1px solid var(--line);background:#fff8e6;border-color:#ecd48a}
.aviso.erro{background:#fdecea;border-color:#e8a79b}
.painel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-bottom:20px}
.numeros{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.numeros div{padding:0 20px;border-left:1px solid var(--line)}
.numeros div:first-child{padding-left:0;border-left:0}
.numeros span{display:block;font-size:.875rem;color:var(--muted)}
.numeros strong{font:700 1.6rem "Source Serif 4",Georgia,serif;white-space:nowrap}
.pos{color:var(--receita)}.neg{color:var(--despesa)}
.uso{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.uso p{margin:0 0 8px}
.trilho{height:14px;background:#e6edea;border-radius:99px;overflow:hidden}
.trilho i{display:block;height:100%;background:var(--despesa);width:0;transition:width .5s}
.grade{display:grid;grid-template-columns:1fr 1.3fr;gap:20px}
h2{font-size:1.2rem;margin-bottom:14px}
.caixa{position:relative;height:260px}
.legenda{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:6px}
.legenda li{display:flex;align-items:center;gap:8px;font-size:.95rem}
.legenda b{width:12px;height:12px;border-radius:3px;flex:none}
.legenda em{margin-left:auto;font-style:normal;color:var(--muted);white-space:nowrap}
.vazio{color:var(--muted);margin:0}
.rolagem{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.875rem}
td.v,th.v{text-align:right;white-space:nowrap}
td.v.r{color:var(--receita)}td.v.d{color:var(--despesa)}
a{color:#1d6b52}
footer{color:var(--muted);font-size:.875rem;margin-top:8px}
@media(max-width:760px){.numeros{grid-template-columns:1fr 1fr;row-gap:18px}.numeros div:nth-child(3){padding-left:0;border-left:0}.grade{grid-template-columns:1fr}}
@media print{.periodo{display:none}body{background:#fff}.painel{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><p class="org" id="org"></p><h1 id="titulo"></h1></div>
    <div class="periodo"><label for="mes">Período</label><select id="mes"></select></div>
  </header>
  <div id="aviso"></div>

  <section class="painel" aria-labelledby="t-resumo">
    <h2 id="t-resumo">Resumo</h2>
    <div class="numeros">
      <div><span>Receitas</span><strong class="pos" id="n-rec">–</strong></div>
      <div><span>Despesas</span><strong class="neg" id="n-des">–</strong></div>
      <div><span>Saldo do período</span><strong id="n-sal">–</strong></div>
      <div><span>Saldo acumulado</span><strong id="n-acu">–</strong></div>
    </div>
    <div class="uso">
      <p id="uso-txt"></p>
      <div class="trilho" role="img" aria-label="Proporção das receitas que foi gasta"><i id="uso-barra"></i></div>
    </div>
  </section>

  <div class="grade">
    <section class="painel" aria-labelledby="t-cat">
      <h2 id="t-cat">Para onde foi o dinheiro</h2>
      <div class="caixa"><canvas id="g-cat" aria-label="Despesas por categoria" role="img"></canvas></div>
      <ul class="legenda" id="legenda"></ul>
    </section>
    <section class="painel" aria-labelledby="t-mes">
      <h2 id="t-mes">Receitas e despesas por mês</h2>
      <div class="caixa" style="height:340px"><canvas id="g-mes" aria-label="Receitas e despesas por mês" role="img"></canvas></div>
    </section>
  </div>

  <section class="painel" aria-labelledby="t-lan">
    <h2 id="t-lan">Lançamentos</h2>
    <div class="rolagem">
      <table>
        <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th class="v">Valor</th><th>Comprovante</th></tr></thead>
        <tbody id="corpo"></tbody>
      </table>
    </div>
  </section>
  <footer id="rodape"></footer>
</div>

<script>
/* ============ CONFIGURAÇÃO — edite só este bloco ============ */
const CONFIG = {
  titulo: "Prestação de contas",
  organizacao: "CEV SÃO JOSÉ",
  // Para ligar o site à planilha, cole aqui o link CSV publicado.
  // Enquanto estiver vazio, o site mostra os dados que estão em DADOS (logo abaixo).
  csvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRo81Axfn29TpPsZu6wQmfO_LnQcJR3kJNSzzgoXI2xPfru2LBX7bk__SQZHeV_4g/pub?gid=1519163133&single=true&output=csv"
};
/* ============================================================ */

const DADOS = `Data,Descrição,Categoria,Tipo,Valor,Comprovante (link)
30/09/2026,Aluguel Parcela setembro,Aluguel,Despesa,"R$ 1.430,00",
30/09/2026,Vendas lanchonete - setembro,Materiais,Despesa,"R$ 480,00",
15/09/2026,Internet Cev Setembro,Internet,Receita,"R$ 600,00",
15/09/2026,Energia cev Setembro,Energia,Despesa,"R$ 156,78",
20/09/2026,Água CEV setembro,CAERN,Despesa,"R$ 58,96",
16/09/2026,Receita STH,Receitas SVES,Receita,"R$ 3.200,00",`;

const $ = s => document.querySelector(s);
const brl = new Intl.NumberFormat("pt-BR", {style:"currency", currency:"BRL"});
const pct = new Intl.NumberFormat("pt-BR", {style:"percent", maximumFractionDigits:1});
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
const COLORS = ["#2f7d5b","#c4553b","#d9a441","#3f6fa8","#8a5a9e","#5ba8a0","#a05f3c","#7a8a3a"];
let ROWS = [], MONTHS = [], charts = {};

function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&t[i+1]==='\n') i++; row.push(f); f=""; rows.push(row); row=[]; }
    else f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()));
}
function parseMoney(s){
  s=(s||"").replace(/[^\d,.\-]/g,"");
  if(!s) return NaN;
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  return parseFloat(s);
}
function parseDate(s){
  s=(s||"").trim(); let m;
  if(m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/)) return {y:+m[3],m:+m[2],d:+m[1]};
  if(m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)) return {y:+m[1],m:+m[2],d:+m[3]};
  return null;
}
function toRows(text){
  const [h,...lines]=parseCSV(text);
  if(!h) return [];
  const ix=k=>h.findIndex(x=>norm(x).startsWith(k));
  const I={d:ix("data"),de:ix("descri"),c:ix("categ"),t:ix("tipo"),v:ix("valor"),l:ix("compro")};
  const out=[];
  for(const r of lines){
    const dt=parseDate(r[I.d]), v=parseMoney(r[I.v]), tp=norm(r[I.t]);
    const t=tp.startsWith("r")?"receita":tp.startsWith("d")?"despesa":null;
    if(!dt||isNaN(v)||!t) continue;
    out.push({
      ym:dt.y+"-"+String(dt.m).padStart(2,"0"),
      ts:Date.UTC(dt.y,dt.m-1,dt.d),
      data:String(dt.d).padStart(2,"0")+"/"+String(dt.m).padStart(2,"0")+"/"+dt.y,
      desc:(r[I.de]||"").trim(), cat:(r[I.c]||"Sem categoria").trim()||"Sem categoria",
      t, v:Math.abs(v), link:(r[I.l]||"").trim()
    });
  }
  return out;
}
const mesLongo = ym => { const [y,m]=ym.split("-"); return new Date(+y,+m-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); };
const mesCurto = ym => { const [y,m]=ym.split("-"); return new Date(+y,+m-1,1).toLocaleDateString("pt-BR",{month:"short"}).replace(".","")+"/"+y.slice(2); };
const soma = (a,t) => a.filter(r=>r.t===t).reduce((s,r)=>s+r.v,0);

function aviso(msg,tipo){ $("#aviso").innerHTML='<div class="aviso '+(tipo||"")+'">'+esc(msg)+'</div>'; }

async function init(){
  $("#titulo").textContent=CONFIG.titulo;
  $("#org").textContent=CONFIG.organizacao;
  document.title=CONFIG.titulo+" · "+CONFIG.organizacao;
  let text;
  if(CONFIG.csvUrl){
    try{ const r=await fetch(CONFIG.csvUrl,{cache:"no-store"}); if(!r.ok) throw 0; text=await r.text(); }
    catch(e){ aviso("Não foi possível carregar a planilha. Confira se ela está publicada na web em formato CSV e se o link em CONFIG.csvUrl está correto.","erro"); return; }
  } else {
    text=DADOS;
  }
  ROWS=toRows(text);
  if(!ROWS.length){ aviso("Nenhum lançamento válido encontrado. Cada linha precisa de data, tipo (Receita ou Despesa) e valor.","erro"); return; }
  MONTHS=[...new Set(ROWS.map(r=>r.ym))].sort();
  const sel=$("#mes");
  sel.innerHTML='<option value="todos">Todos os meses</option>'+[...MONTHS].reverse().map(m=>'<option value="'+m+'">'+esc(mesLongo(m))+'</option>').join("");
  sel.value=MONTHS[MONTHS.length-1];
  sel.addEventListener("change",render);
  const agora=new Date();
  $("#rodape").textContent="Dados carregados em "+agora.toLocaleDateString("pt-BR")+" às "+agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})+". Para ver as informações mais recentes, atualize a página.";
  render();
}

function render(){
  const v=$("#mes").value;
  const cur=v==="todos"?ROWS:ROWS.filter(r=>r.ym===v);
  const acum=v==="todos"?ROWS:ROWS.filter(r=>r.ym<=v);
  const rec=soma(cur,"receita"), des=soma(cur,"despesa"), sal=rec-des, acu=soma(acum,"receita")-soma(acum,"despesa");

  $("#n-rec").textContent=brl.format(rec);
  $("#n-des").textContent=brl.format(des);
  const s=$("#n-sal"); s.textContent=brl.format(sal); s.className=sal<0?"neg":"pos";
  const a=$("#n-acu"); a.textContent=brl.format(acu); a.className=acu<0?"neg":"pos";

  const uso=rec>0?des/rec:(des>0?Infinity:0);
  $("#uso-barra").style.width=Math.min(uso*100,100)+"%";
  $("#uso-txt").textContent=rec===0&&des===0?"Sem movimentação no período."
    :rec===0?"Houve despesas e nenhuma receita no período."
    :uso>1?"As despesas ficaram "+pct.format(uso-1)+" acima das receitas do período."
    :"Foram gastos "+pct.format(uso)+" do que entrou no período.";

  // categorias de despesa
  const porCat={}; cur.filter(r=>r.t==="despesa").forEach(r=>porCat[r.cat]=(porCat[r.cat]||0)+r.v);
  const cats=Object.entries(porCat).sort((x,y)=>y[1]-x[1]);
  $("#legenda").innerHTML=cats.length?cats.map(([c,val],i)=>'<li><b style="background:'+COLORS[i%COLORS.length]+'"></b>'+esc(c)+'<em>'+brl.format(val)+' · '+pct.format(val/des)+'</em></li>').join(""):'<li class="vazio">Nenhuma despesa no período.</li>';
  charts.cat&&charts.cat.destroy();
  charts.cat=new Chart($("#g-cat"),{type:"doughnut",
    data:{labels:cats.map(c=>c[0]),datasets:[{data:cats.map(c=>c[1]),backgroundColor:cats.map((_,i)=>COLORS[i%COLORS.length]),borderWidth:2,borderColor:"#fff"}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{display:false},
      tooltip:{callbacks:{label:c=>" "+c.label+": "+brl.format(c.parsed)+" ("+pct.format(c.parsed/des)+")"}}}}});

  // receitas x despesas por mês (últimos 12)
  const ms=MONTHS.slice(-12);
  charts.mes&&charts.mes.destroy();
  charts.mes=new Chart($("#g-mes"),{type:"bar",
    data:{labels:ms.map(mesCurto),datasets:[
      {label:"Receitas",data:ms.map(m=>soma(ROWS.filter(r=>r.ym===m),"receita")),backgroundColor:"#2f7d5b",borderRadius:3},
      {label:"Despesas",data:ms.map(m=>soma(ROWS.filter(r=>r.ym===m),"despesa")),backgroundColor:"#c4553b",borderRadius:3}]},
    options:{responsive:true,maintainAspectRatio:false,
      scales:{y:{beginAtZero:true,ticks:{callback:x=>brl.format(x)}}},
      plugins:{tooltip:{callbacks:{label:c=>" "+c.dataset.label+": "+brl.format(c.parsed.y)}}}}});

  // tabela
  $("#corpo").innerHTML=[...cur].sort((x,y)=>y.ts-x.ts).map(r=>
    '<tr><td>'+r.data+'</td><td>'+esc(r.desc)+'</td><td>'+esc(r.cat)+'</td><td>'+(r.t==="receita"?"Receita":"Despesa")+'</td>'+
    '<td class="v '+(r.t==="receita"?"r":"d")+'">'+(r.t==="receita"?"+ ":"− ")+brl.format(r.v)+'</td>'+
    '<td>'+(/^https?:\/\//i.test(r.link)?'<a href="'+esc(r.link)+'" target="_blank" rel="noopener">Ver comprovante</a>':"–")+'</td></tr>').join("");
}
Chart.defaults.font.family='"Source Sans 3",system-ui,sans-serif';
init();
</script>
</body>
</html>
